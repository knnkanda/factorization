<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>因数分解ダンジョン</title>
  <style>
    :root{--ink:#172033;--muted:#687287;--paper:#fffaf0;--blue:#4969df;--blue2:#e9edff;--orange:#f27a4b;--green:#22956f;--line:#dfe4ef}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f4f6ff,#fff8ed);color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif}
    .app{max-width:760px;margin:auto;padding:18px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--blue);font-weight:800}.title{font-size:clamp(26px,7vw,42px);line-height:1.05;margin:5px 0;font-weight:900}.sub{color:var(--muted);font-size:14px;margin:0}.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-weight:800;white-space:nowrap}
    .hero{background:var(--paper);border:1px solid #f0e5ce;border-radius:25px;padding:18px;box-shadow:0 12px 35px #6470a01c}.progress{height:9px;background:#eceff6;border-radius:99px;overflow:hidden;margin:15px 0 19px}.bar{height:100%;background:linear-gradient(90deg,var(--blue),#8b76ec);width:33%;transition:.3s}.stage{display:inline-flex;gap:8px;align-items:center;color:var(--blue);font-weight:900;font-size:14px}.stage span{background:var(--blue);color:#fff;border-radius:50%;width:25px;height:25px;display:grid;place-items:center}.question{font-size:clamp(32px,9vw,58px);font-weight:900;letter-spacing:.02em;text-align:center;padding:22px 0 16px}.hint{font-size:14px;color:var(--muted);text-align:center;margin-bottom:14px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.choice{border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px 10px;font-size:clamp(17px,4vw,22px);font-weight:800;color:var(--ink);cursor:pointer;min-height:64px;transition:.18s}.choice:hover{transform:translateY(-2px);border-color:var(--blue)}.choice:disabled{cursor:default;transform:none}.choice.correct{border-color:var(--green);background:#e9fbf4}.choice.wrong{border-color:var(--orange);background:#fff0eb}.feedback{margin-top:15px;padding:14px;border-radius:15px;font-weight:800;line-height:1.6}.feedback.ok{background:#e9fbf4;color:#176d54}.feedback.no{background:#fff0eb;color:#a4482c}.explain{font-weight:500;font-size:14px;margin-top:5px}.next{width:100%;border:0;border-radius:15px;padding:15px;margin-top:13px;background:var(--ink);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.next:disabled{opacity:.4;cursor:not-allowed}.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.tip{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 9px;font-size:12px;color:var(--muted);line-height:1.45}.tip b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
    @media(max-width:480px){.app{padding:14px 12px 30px}.tips{grid-template-columns:1fr}.top{align-items:flex-start}.badge{font-size:12px;padding:8px}.choices{grid-template-columns:1fr 1fr}.choice{padding:12px 6px}}
  </style>
<style>.process{display:none;background:#f4f6ff;border:1px solid #dce2ff;border-radius:16px;padding:13px;margin:0 0 14px;text-align:center}.process.show{display:block}.process .label{font-size:12px;color:#4969df;font-weight:900;margin-bottom:8px}.steps{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}.step{background:#fff;border-radius:10px;padding:8px 10px;font-weight:800}.arrow{color:#4969df;font-weight:900}.wrong-work{background:#fff;border:1px dashed #f0a188;border-radius:11px;padding:9px;margin-top:8px;font-weight:800;color:#8f432e}.hintBtn{width:100%;margin-top:11px;border:1px solid #cbd4ff;background:#eef1ff;color:#4059c8;border-radius:13px;padding:11px;font-weight:900;cursor:pointer}.hintBox{display:none;background:#fff;border:1px solid #dce2ff;border-radius:13px;padding:11px;margin-top:9px;text-align:left;color:#44506a;font-size:14px;line-height:1.65}.hintBox.show{display:block}.hintBox b{color:#172033}.tip{font-size:14px}.tip b{font-size:14px}.footer{font-size:13px}</style>
</head>
<body>
<main class="app">
  <div class="top"><div><div class="eyebrow">MATH QUEST / FACTORING</div><h1 class="title">因数分解<br>ダンジョン</h1><p class="sub">式を「かけ算の形」に戻して、扉を開こう。</p></div><div class="badge" id="score">⭐ 0</div></div>
  <section class="hero"><div class="stage"><span id="stageNo">1</span><b id="stageName">共通因数の森</b></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="hint" id="hint"></div><div class="choices" id="choices"></div><button class="hintBtn" id="hintBtn">💡 ヒントを見る</button><div class="hintBox" id="hintBox"></div><div id="feedback"></div><button class="next" id="next" disabled>答えを選んでください</button></section>
  <section class="tips"><div class="tip"><b>① まず観察</b>全部の項に共通する数や文字を探す。</div><div class="tip"><b>② 積と和</b>最後の数が積、真ん中が和。</div><div class="tip"><b>③ 展開で確認</b>戻して同じ式になれば正解。</div></section>
  <p class="footer">正解すると、式が展開されて答え合わせできます。</p>
</main>
<script>
const stages=[
 {name:'共通因数の森',items:[
  {q:'6x + 9',h:'すべての項に共通する最大の数は？',a:'3(2x + 3)',o:['2(3x + 9)','3(2x + 3)','x(6 + 9)','6(x + 9)'],e:'6x + 9 = 3(2x + 3)。まず最大公約数の3をくくります。'},
  {q:'8a² − 12a',h:'数字と文字の共通因数を探そう。',a:'4a(2a − 3)',o:['2a(4a − 6)','4a(2a − 3)','8a(a − 12)','a(8a − 12)'],e:'8a² − 12a = 4a(2a − 3)。4aをくくると、残りは2a−3です。'},
  {q:'15y + 25',h:'15と25の最大公約数を探そう。',a:'5(3y + 5)',o:['5(3y + 5)','3(5y + 25)','y(15 + 25)','25(15y + 1)'],e:'15y + 25 = 5(3y + 5)。'},
  {q:'12b² + 18b',h:'数字と文字の共通因数を探そう。',a:'6b(2b + 3)',o:['6b(2b + 3)','3b(4b + 6)','12b(b + 18)','b(12b + 18)'],e:'12b² + 18b = 6b(2b + 3)。'},
  {q:'21m² − 14m',h:'21と14、m²とmの共通因数を探そう。',a:'7m(3m − 2)',o:['7m(3m − 2)','14m(3m − 1)','m(21m − 14)','7(3m² − 2m)'],e:'21m² − 14m = 7m(3m − 2)。'}]},
 {name:'組み合わせ工場',items:[
  {q:'x² + 7x + 12',h:'積が12、和が7になる2数は？',a:'(x + 3)(x + 4)',o:['(x + 2)(x + 6)','(x + 3)(x + 4)','(x + 1)(x + 12)','(x − 3)(x − 4)'],e:'3×4=12、3+4=7なので、(x+3)(x+4)です。'},
  {q:'x² − 9x + 20',h:'積が20、和が−9になる2数は？',a:'(x − 4)(x − 5)',o:['(x + 4)(x + 5)','(x − 2)(x − 10)','(x − 4)(x − 5)','(x + 4)(x − 5)'],e:'−4×−5=20、−4＋−5=−9です。'},
  {q:'x² + 9x + 20',h:'積が20、和が9になる2数は？',a:'(x + 4)(x + 5)',o:['(x + 2)(x + 10)','(x + 4)(x + 5)','(x − 4)(x − 5)','(x + 1)(x + 20)'],e:'4×5=20、4＋5=9です。'},
  {q:'x² − x − 12',h:'積が−12、和が−1になる2数は？',a:'(x − 4)(x + 3)',o:['(x − 2)(x + 6)','(x − 4)(x + 3)','(x + 4)(x − 3)','(x − 6)(x + 2)'],e:'−4×3=−12、−4＋3=−1です。'},
  {q:'x² + 2x − 15',h:'積が−15、和が2になる2数は？',a:'(x + 5)(x − 3)',o:['(x + 3)(x − 5)','(x + 5)(x − 3)','(x − 1)(x + 15)','(x + 1)(x − 15)'],e:'5×−3=−15、5＋−3=2です。'}]},
 {name:'平方の差の洞窟',items:[
  {q:'x² − 25',h:'2つの平方の差になっている？',a:'(x + 5)(x − 5)',o:['(x + 25)(x − 25)','(x + 5)(x − 5)','(x − 5)²','(x + 5)²'],e:'x²−5²=(x+5)(x−5)。平方の差の公式です。',p:['x² − 5²','(x + 5)(x − 5)','x² − 25']},
  {q:'4x² − 49',h:'4x²=(2x)²、49=7²と見抜こう。',a:'(2x + 7)(2x − 7)',o:['(4x + 7)(4x − 7)','(2x + 7)(2x − 7)','(2x − 7)²','(x + 7)(x − 7)'],e:'(2x)²−7²=(2x+7)(2x−7)です。',p:['(2x)² − 7²','(2x + 7)(2x − 7)','4x² − 49']},
  {q:'9y² − 16',h:'9y²=(3y)²、16=4²と見抜こう。',a:'(3y + 4)(3y − 4)',o:['(9y + 4)(9y − 4)','(3y + 4)(3y − 4)','(3y − 4)²','(y + 4)(y − 4)'],e:'(3y)²−4²=(3y+4)(3y−4)です。',p:['(3y)² − 4²','(3y + 4)(3y − 4)','9y² − 16']},
  {q:'25a² − 36',h:'25a²=(5a)²、36=6²と見抜こう。',a:'(5a + 6)(5a − 6)',o:['(25a + 6)(25a − 6)','(5a + 6)(5a − 6)','(5a − 6)²','(a + 6)(a − 6)'],e:'(5a)²−6²=(5a+6)(5a−6)です。',p:['(5a)² − 6²','(5a + 6)(5a − 6)','25a² − 36']},
  {q:'49p² − 81',h:'49p²=(7p)²、81=9²と見抜こう。',a:'(7p + 9)(7p − 9)',o:['(7p + 9)²','(7p + 9)(7p − 9)','(49p + 9)(49p − 9)','(p + 9)(p − 9)'],e:'(7p)²−9²=(7p+9)(7p−9)です。',p:['(7p)² − 9²','(7p + 9)(7p − 9)','49p² − 81']}]}
];
let si=0, qi=0, score=0, answered=false;
const $=id=>document.getElementById(id);
function render(){const s=stages[si],it=s.items[qi];$('stageNo').textContent=si+1;$('stageName').textContent=s.name;$('bar').style.width=((si*2+qi+1)/6*100)+'%';$('question').textContent=it.q;$('hint').textContent=it.h;$('feedback').innerHTML='';$('next').disabled=true;$('next').textContent=qi<s.items.length-1?'次の問題へ':si<stages.length-1?'次のステージへ':'最初からもう一度';answered=false;$('hintBox').className='hintBox';$('hintBox').innerHTML=si===1?(qi===0?'<b>積の組み合わせ：</b>1×12、2×6、3×4<br><b>和の組み合わせ：</b>1＋12＝13、2＋6＝8、3＋4＝7<br><b>探す条件：</b>積が12、和が7':'<b>積の組み合わせ：</b>1×20、2×10、4×5<br><b>和の組み合わせ：</b>1＋20＝21、2＋10＝12、4＋5＝9<br><b>探す条件：</b>積が20、和が−9')+ '<br>積と和の両方を満たす組を選ぼう。':si===0?(qi===0?'<b>共通因数：</b>6と9を割り切れる最大の数は3。<br>6x÷3＝2x、9÷3＝3なので、3(2x＋3)です。':'<b>共通因数：</b>8a²と12aの共通因数は4a。<br>8a²÷4a＝2a、12a÷4a＝3なので、4a(2a−3)です。'):'<b>平方の差：</b>a²−b²=(a＋b)(a−b)。<br>x²−25なら、25＝5²です。';let p=document.getElementById('process');if(!p){p=document.createElement('div');p.id='process';document.querySelector('.question').before(p)}p.className='process'+(it.p?' show':'');p.innerHTML=it.p?`<div class="label">平方の差の公式を使うプロセス</div><div class="steps"><div class="step">${it.p[0]}</div><div class="arrow">→</div><div class="step">${it.p[1]}</div><div class="arrow">→</div><div class="step">${it.p[2]}</div></div>`:'';const opts=[it.a,it.o.find(x=>x!==it.a)];$('choices').innerHTML=opts.map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b,it));}
function choose(btn,it){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const ok=btn.textContent===it.a;btn.classList.add(ok?'correct':'wrong');if(ok){score++;$('score').textContent='⭐ '+score;$('feedback').innerHTML=`<div class="feedback ok">正解！${it.e}<div class="explain">展開すると、もとの式に戻ります。</div></div>`;}else{const wrong={'2(3x + 9)':'6x + 18','2a(4a − 6)':'8a² − 12a','(x + 25)(x − 25)':'x² − 625','(x − 5)²':'x² − 10x + 25','(x + 5)²':'x² + 10x + 25','(4x + 7)(4x − 7)':'16x² − 49','(2x − 7)²':'4x² − 28x + 49','(x + 7)(x − 7)':'x² − 49'}[btn.textContent]||'この因数を分配法則で展開して比べよう';const same=btn.textContent==='2a(4a − 6)';$('feedback').innerHTML=`<div class="feedback ${same?'ok':'no'}">この答えを展開すると…<div class="wrong-work">${btn.textContent} → ${wrong}</div><div class="explain">${same?'展開結果は元の式と一致します。ただし、まだ共通因数2が残っているので、4aまでくくるとより簡単な形になります。':'もとの式は <strong>'+it.q+'</strong> なので一致しません。'} 正解は <strong>${it.a}</strong> です。</div></div>`;document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===it.a)b.classList.add('correct')})}$('next').disabled=false;}
$('next').onclick=()=>{if(qi<stages[si].items.length-1)qi++;else if(si<stages.length-1){si++;qi=0}else{si=0;qi=0;score=0;$('score').textContent='⭐ 0'}render()};const firstRender=render;render=()=>{firstRender();$('bar').style.width=((si*5+qi+1)/15*100)+'%';$('hintBtn').textContent='💡 ヒントを見る';$('hintBox').innerHTML=$('hintBox').innerHTML.replace('なので、3(2x＋3)です。','ここから自分で組み立てよう。').replace('なので、4a(2a−3)です。','ここから自分で組み立てよう。');if(si===2){const it=stages[si].items[qi];$('choices').innerHTML=it.o.map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b,it));}};render();
const renderWithChoices=render;render=()=>{renderWithChoices();const hs=[['6と9の共通因数は3。','8a²と12aの共通因数は4a。','15と25の共通因数は5。','12b²と18bの共通因数は6b。','21m²と14mの共通因数は7m。'],['積20：1×20、2×10、4×5。和9：1+20、2+10、4+5。','積20：1×20、2×10、4×5。和−9：−4+−5。','積−12：−1×12、−2×6、−4×3。和−1：−4+3。','積−15：−1×15、−3×5。和2：5+−3。']];if(si<2&&hs[si][qi])$('hintBox').innerHTML='<b>'+hs[si][qi]+'</b><br>条件を満たす組を探して、自分で組み立てよう。'};render();$('hintBtn').onclick=()=>{$('hintBox').classList.toggle('show');$('hintBtn').textContent=$('hintBox').classList.contains('show')?'💡 ヒントを閉じる':'💡 ヒントを見る'};
</script>
</body></html>
